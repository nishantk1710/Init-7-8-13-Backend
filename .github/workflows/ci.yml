# Backend CI.
#
# Paths here are relative to the REPOSITORY root, and this repository's root is
# the backend application itself -- there is no `backend/` prefix. If these
# workflows are ever folded back into a single repo, every path below and the
# `working-directory` need revisiting.
#
# What this protects: 287 of 289 tests. The 2 that skip need the ~800 MB SAP
# extract delivery, which will never live in CI. That is by design, not a gap --
# see the "storage" note on the test step.

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run on the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Match compose.yaml. A different major version here would mean CI
        # tests a database nobody develops against.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: postgres
          POSTGRES_DB: spares_ai_ci
        ports:
          - 5432:5432
        # Without this the job can start connecting before Postgres accepts
        # connections, and the first migration fails intermittently.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # 127.0.0.1, not localhost: the same IPv6-vs-IPv4 resolution trap that
      # cost ~19s per connection locally. Service containers publish on IPv4.
      DATABASE_URL: postgresql+psycopg://postgres:ci@127.0.0.1:5432/spares_ai_ci
      # Deliberately unset. The SAP extracts are not in CI, so the two tests
      # that need them skip and say so.
      STORAGE_URL: ""
      # app/core/db.py refuses any non-Azure-SQL DATABASE_URL by default, since
      # Azure SQL is the only backend outside this runner. sql-vzi-aicom-nonprod
      # sits behind a private endpoint a GitHub-hosted runner cannot reach, so
      # this lifts the gate here only -- see require_azure_sql's docstring.
      ALLOW_NON_AZURE_SQL: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Pinned to the version the team develops on. "3.x" would silently
          # move under us and turn a Python release into a red build.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations
        # Proves the migrations actually run against an empty database -- which
        # `pytest` alone does not, since it finds the schema already there.
        run: alembic upgrade head

      - name: Run tests
        # -rs lists the skipped tests with their reason, so "2 skipped" is
        # visible in the log as a deliberate choice rather than a silent hole.
        # "not live and not drift" matches deploy.yml: live needs real CPI
        # network/credentials this runner doesn't have, and drift compares our
        # recorded knowledge of SAP against itself -- it fails when SAP changes
        # underneath us, which is information about an external system, not a
        # reason to redden every unrelated PR. "not needs_seed_data" excludes
        # tests that assert against the real seeded extract (raw_* tables,
        # built features, generated recommendations) -- see pytest.ini, marker
        # 'needs_seed_data'. A command-line -m replaces pytest.ini's addopts
        # rather than adding to it, so this must repeat all three.
        run: pytest -q -rs -m "not live and not drift and not needs_seed_data"

      # Drift is reported, never blocking -- see the marker's description in
      # pytest.ini and the matching step in deploy.yml.
      - name: SAP contract drift (informational)
        continue-on-error: true
        run: |
          pytest -q -m "drift" \
            || echo "::warning::SAP contract drift detected -- see pytest.ini, marker 'drift'"

  # `npm run lint`'s equivalent is deliberately not a step yet. Add ruff or
  # flake8 in the same change that fixes whatever it first reports, so CI starts
  # green and stays meaningful -- the frontend workflow carries the same note
  # about its own three pre-existing lint errors.
