# Backend deployment to Azure App Service (app-vzi-aicom-nonprod-san).
#
# NONPROD ONLY, FROM THE dev BRANCH
#
# Merges to dev deploy here. main no longer deploys from GitHub: it is mirrored
# to Azure DevOps (mirror-to-devops.yml), and azure-pipelines.yml deploys it to
# production behind an approval. Nothing in this file can reach prod -- the
# publish profile it uses is nonprod's.
#
# WHAT CHANGED, AND WHY IT MATTERS
#
# The previous version of this file was written before VZI's Azure existed and
# said so. Two things in it would now fail:
#
#   1. It ran `alembic upgrade head` on the GitHub runner. It cannot work.
#      sql-vzi-aicom-nonprod-san has public network access disabled and is
#      reached through pe-sqlvziaicomnonprod-sqlserver, so the runner has no
#      network path to the database and no secret changes that. Migrations now
#      run inside the App Service, from startup.sh, on the other side of the
#      private endpoint. There are two of them: ingestion_run and, since
#      21-Sep, ingest_watermark -- a deployment that skips them leaves
#      `app.ingest --delta` with nowhere to record how far it got.
#
#   2. It had no startup command, so Oryx would guess -- and its guess for a
#      FastAPI app is a sync gunicorn worker, which cannot run ASGI.
#
# STILL REQUIRED BEFORE THIS RUNS
#
#   * Repository secret AZURE_WEBAPP_PUBLISH_PROFILE, or preferably OIDC via
#     azure/login (no long-lived credential in GitHub).
#   * App settings on the App Service -- NOT here, and NOT in this repository:
#       DATABASE_URL     mssql+pyodbc://...  (carries a password; use a Key
#                                             Vault reference, see README)
#       STORAGE_URL      abfss://<container>@stvziaicomnonprod.dfs.core.windows.net/...
#       INGEST_PREFIX    optional; defaults to "odata". Where app.ingest lands
#                        what it pulls from CPI.
#       FRONTEND_ORIGIN  the frontend's origin. Defaults to localhost:3000,
#                        which is not what a deployed browser will send.
#       APP_ENV          cosmetic -- it appears in one startup log line and
#                        gates nothing. Set it so the log does not say "local".
#       FOUNDRY_*        endpoint, key, deployments
#       CPI_*            base URL, token URL, client id and secret
#   * A system-assigned managed identity on the App Service, with
#     "Storage Blob Data CONTRIBUTOR" on stvziaicomnonprod. Reader is enough for
#     everything the API does, but app.ingest writes what it pulls from CPI, and
#     with Reader alone that write is an opaque
#     "AuthorizationPermissionMismatch". Granted 21-Sep and verified.
#   * Startup Command set to: bash /home/site/wwwroot/startup.sh
#   * CPI's allowlist updated for the App Service's outbound IPs, if it has one.
#     Asked late, this costs a day of Azure time.

name: Deploy backend

on:
  push:
    branches: [dev]
    paths:
      - "**"
      - "!**.md"
  workflow_dispatch:

concurrency:
  # Two deployments racing onto one App Service leaves it in whichever state
  # finished last, which is not necessarily the newer commit.
  group: deploy-backend
  cancel-in-progress: false

env:
  AZURE_WEBAPP_NAME: app-vzi-aicom-nonprod-san
  PYTHON_VERSION: "3.12"

  # NOT <app-name>.azurewebsites.net. Azure issues a unique default hostname
  # with a random suffix and a regional segment, so the smoke checks have to be
  # told it rather than deriving it from the app name. Derived, they would curl
  # a host that does not resolve and report a healthy deployment as broken --
  # or worse, report someone else's app as ours.
  #
  # Portal -> Overview -> Default domain, if this ever needs re-checking.
  AZURE_WEBAPP_HOSTNAME: >-
    app-vzi-aicom-nonprod-san-hkhabvd6dkegfbh4.southafricanorth-01.azurewebsites.net

jobs:
  # The one test run per merge to dev. ci.yml deliberately does not run on dev
  # pushes any more: this job carries the same SQL Server service container,
  # migrations and marker filter ci.yml uses on PRs, so the gate is the strong
  # (DB-backed) suite rather than the old weaker copy that let the database
  # tests skip -- and the suite runs once per merge instead of twice.
  test:
    runs-on: ubuntu-latest

    services:
      mssql:
        # Same container as ci.yml: the app only ever talks to Azure SQL
        # (mssql+pyodbc); a different engine here would test a database nobody
        # deploys against.
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "ci-Passw0rd!"
        ports:
          - 1433:1433
        # Without this the job can start connecting before SQL Server accepts
        # connections, and the first migration fails intermittently.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ci-Passw0rd! -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      # See ci.yml for why 127.0.0.1 (not localhost) and why
      # TrustServerCertificate=yes is acceptable ONLY against this container.
      DATABASE_URL: >-
        mssql+pyodbc://sa:ci-Passw0rd!@127.0.0.1:1433/spares_ai_ci
        ?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=yes
      # Deliberately unset: the SAP extracts are not in CI, and the tests that
      # need them skip and say so.
      STORAGE_URL: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ODBC Driver 18 for SQL Server
        # pyodbc needs this system package; see ci.yml.
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
          sudo apt-get update
          ACCEPT_EULA=Y sudo apt-get install -y msodbcsql18 unixodbc-dev mssql-tools18

      - run: pip install -r requirements.txt

      - name: Create test database
        run: |
          /opt/mssql-tools18/bin/sqlcmd -S 127.0.0.1 -U sa -P "ci-Passw0rd!" -C \
            -Q "IF DB_ID('spares_ai_ci') IS NULL CREATE DATABASE spares_ai_ci"

      - name: Apply migrations
        # Proves the migrations actually run against an empty database -- which
        # `pytest` alone does not, since it finds the schema already there.
        run: alembic upgrade head

      # The build gate. Azure-dependent tests skip here by design -- this runner
      # is outside the VNet -- so what runs is everything that does not need
      # Azure, including the storage conformance suite against its fake.
      #
      # All three markers are spelled out because a command-line -m REPLACES the
      # one in pytest.ini's addopts rather than combining with it. Writing only
      # "not drift" here would silently re-enable the live SAP tests and have
      # this runner call CPI on every push.
      #
      # Green here does NOT mean the deployment works. The smoke checks below,
      # and W2.2 from inside the App Service, are what prove that.
      - name: Tests
        run: python -m pytest -q -rs -m "not live and not drift and not needs_seed_data"

      # Drift is reported, never blocking. These compare our recorded knowledge
      # of SAP against itself; they fail when SAP changes, which is information
      # rather than a reason to refuse a deployment of unrelated code.
      - name: SAP contract drift (informational)
        continue-on-error: true
        run: |
          python -m pytest -q -m "drift" \
            || echo "::warning::SAP contract drift detected -- see pytest.ini, marker 'drift'"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Guard -- refuse to deploy without a publish credential
        run: |
          if [ -z "${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}" ]; then
            echo "AZURE_WEBAPP_PUBLISH_PROFILE is not set. See the header of this file."
            exit 1
          fi

      # Oryx builds on the App Service side (SCM_DO_BUILD_DURING_DEPLOYMENT),
      # which is what installs pyodbc against the image's ODBC driver. Building
      # wheels here instead would ship a Linux-runner build that may not match.
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .

      - name: Smoke check -- liveness
        # /api/health is dependency-free, so this proves the process started and
        # is serving. It says nothing about the database or storage.
        run: |
          curl --fail --retry 10 --retry-delay 10 --retry-all-errors \
            "https://${{ env.AZURE_WEBAPP_HOSTNAME }}/api/health"

      - name: Smoke check -- readiness
        # /api/ready touches the database, storage and the model. A 503 here on
        # a 200 above means the app is running but cannot reach its dependencies
        # -- the private endpoints, the managed identity's role assignment, or a
        # missing app setting. Reported, not fatal: a deployment that is up but
        # not yet wired is still worth having deployed, and the body says which
        # dependency is unhappy.
        continue-on-error: true
        run: |
          curl --silent --show-error --fail-with-body --retry 5 --retry-delay 10 \
            "https://${{ env.AZURE_WEBAPP_HOSTNAME }}/api/ready" \
            || echo "::warning::/api/ready is not green yet -- see the body above"
