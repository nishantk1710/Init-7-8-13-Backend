[pytest]
# Make the `app` package importable when running `pytest` from backend/.
pythonpath = .
testpaths = tests

# Tests that call live SAP are excluded from the default run and from CI.
#
# Not because they are unimportant -- they are the only thing that proves the
# client works against the real service -- but because they fail for reasons
# that are not the code: no credentials on a teammate's machine, no network in
# CI, or a corporate proxy terminating TLS (set CPI_CA_BUNDLE for that).
#
# Run them deliberately, from a machine that can reach CPI:
#     pytest -m live
#
# `drift` is deliberately NOT excluded here -- see its description below.
addopts = -m "not live"

markers =
    live: talks to live SAP through CPI. Excluded by default; run with `pytest -m live`.
    drift: compares our recorded knowledge of SAP -- the discovery snapshot against the
        constants in app/integrations/sap/known_conditions.py. Touches no network and no
        database. Runs by default so drift stays visible, but deploy.yml runs it as a
        separate NON-BLOCKING step: these assert facts about an external system we do not
        control, and a deployment should not be blocked by SAP changing underneath us.
        12 are failing as of 2026-09-15 -- a discovery re-run refreshed the snapshot and
        five ZMM_KPI02_SRV sets began rejecting every request with HTTP 400. Re-baselining
        known_conditions.py would make them green and erase the only signal that ~1.17M
        rows of change-document data stopped being readable. Resolve that first.
